name: Release mod

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag matches mod version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content -Raw mod.json | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "Release tag '$tag' must match mod.json version '$version'."
          }

      - name: Set up Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: latest

      - name: Set up Geode SDK
        shell: pwsh
        run: |
          $profilePath = Join-Path $env:GITHUB_WORKSPACE "dummy-profile"
          New-Item -ItemType Directory -Path $profilePath | Out-Null
          geode profile add --name ci "$profilePath/GeometryDash.exe" win
          $sdkPath = Join-Path $env:GITHUB_WORKSPACE "geode-sdk"
          geode sdk install $sdkPath
          $env:GEODE_SDK = $sdkPath
          geode sdk update 5.9.0
          geode sdk install-binaries
          "GEODE_SDK=$sdkPath" >> $env:GITHUB_ENV
          "GEODE_DONT_INSTALL_MODS=ON" >> $env:GITHUB_ENV

      - name: Build release package
        run: geode build --config Release -- -DGEODE_DONT_INSTALL_MODS=ON

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/oliver.ai-connector.geode
